<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audio Lab Starter</title><link rel="stylesheet" href="/styles.css"></head>
<body><main><header><p class="eyebrow">LOCAL STARTER</p><h1>Audio Lab</h1><p>Turn source-preserving text into a private listening queue.</p></header>
<section id="library-view"><form id="add"><label>Title<input name="title" required value="A synthetic field note"></label><label>Source URL<input name="canonicalUrl" type="url" value="https://example.com/synthetic-field-note"></label><label>Source text<textarea name="sourceText" required>A synthetic article about tides, tools, and patient iteration. No private content is included. Add more synthetic paragraphs to test follow-along scrolling without exposing real reading material.</textarea></label><button>Save and generate fixture audio</button></form>
<p id="status" role="status"></p><section><h2>Library</h2><div id="library"></div></section></section>
<article id="reader-view" hidden><div class="reader-heading"><div class="article-actions top-article-actions" role="group" aria-label="Article actions"><button data-article-action="back">Back to Library</button><button data-article-action="copy-url">Copy source URL</button><button data-article-action="remove">Remove Article</button></div><h2 id="reader-title"></h2><p id="reader-notice" role="status" aria-live="polite"></p></div><div id="transcript" class="transcript" tabindex="-1"></div>
<aside class="persistent-player" aria-label="Persistent audio player"><audio id="player" controls preload="metadata"></audio><div class="article-actions player-article-actions" role="group" aria-label="Article actions"><button data-article-action="back">Back to Library</button><button data-article-action="copy-url">Copy source URL</button><button data-article-action="remove">Remove Article</button></div><p id="player-notice" role="status" aria-live="polite"></p></aside></article>
</main><script type="module" src="/app.js"></script></body></html>
